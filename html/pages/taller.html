<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="/assets/icons/taller_icon.png">       
        <title>El Taller | Tania's World</title>
        <link rel="stylesheet" href="../../css/pages/taller.css">
        <link rel="stylesheet" href="../../css/components/navbar.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Amaranth:ital,wght@0,400;0,700;1,400;1,700&family=Bitcount+Grid+Double:wght@100..900&family=Jersey+10&family=Outfit:wght@100..900&family=Viga&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="navbar-container"></div>
        <div class="workshop-container">        
            <div class="workshop-background">
                <img src="../../assets/images/TallerModule/workshop_base.png" class="workshop-base">
            </div>
            <div class="workshop-header">
                <div class="workshop-title-box">                    
                    <h1 class="workshop-title">El Taller</h1>  
                    <img src="/assets/icons/taller_icon2.png"  class="title-icon">              
                </div>
                <div class="workshop-subtitle-box">                    
                    <h2>✦Experiencia &amp; trayectoria✦</h2>
                </div>
            </div>
            <div class="workshop-trajectory">
                <img src="../../assets/images/TallerModule/exp_board.png"  class="trajectory-board">
                <h2 class="trajectory-title">Mi trayectoria</h2>
                <div class="trajectory-companies">                    
                    <div class="trajectory-company" data-company="rica">
                        <img src="../../assets/icons/coca_icon.png" class="company-icon">
                        <h3 class="company-name">Grupo RICA</h3>
                        <p class="company-period">2023 - 2025</p>
                    </div>
                    <div class="trajectory-company"  data-company="bluetab">
                        <img src="../../assets/icons/bluetab_exp.png" class="company-icon">
                        <h3 class="company-name">Bluetab an IBM Company</h3>
                        <p class="company-period">2025 - Presente</p>
                    </div>
                    <div class="trajectory-arrow">→</div>
                </div>  
            </div>
            <div class="experience-view" hidden>
                <div class="experience-card">
                    <img src="../../assets/images/TallerModule/exp_card.png" class="experience-card-image">
                    <div class="experience-timeline"></div>
                    <div class="experience-content">                    
                        <div class="experience-info">
                            <div class="company-info">
                                <img  class="company-iconcard">
                                <div class="company-info-text">
                                    <h1 class="company-infoname"></h1>
                                    <p class="company-infoperiod"></p>
                                </div>                               
                            </div>  
                            <div class="experience-scroll" >
                                <div class="company-about">
                                    <div class="info-subtitle">
                                        <img src="../../assets/icons/about_icon.png" class="subtitle-icon">
                                        <h3 class="subtitle">Sobre la empresa</h3>                                                        
                                    </div>
                                    <p id="about-content" class="content-info"></p>
                                </div>   
                                <div class="rol-info">
                                    <div class="info-subtitle">
                                        <img src="../../assets/icons/myrole_icon.png" class="subtitle-icon">
                                        <h3 class="subtitle">Mi rol</h3>                                                      
                                    </div>
                                    <div class="roles-content"></div>
                                </div>                                                
                                <div class="tecnologies-info">
                                    <div class="info-subtitle">
                                        <img src="../../assets/icons/tecs_icon.png" class="subtitle-icon">
                                        <h3 class="subtitle">Tecnologías</h3>                                                        
                                    </div>
                                    <div class="technologies-carousel">
                                        <button class="technology-arrow" id="technology-previous">‹</button>
                                        <div id="tecnologies-content" class="technologies-viewport"></div>
                                        <button class="technology-arrow" id="technology-next">›</button>
                                    </div>
                                </div>
                                <div class="learning-info">
                                    <div class="info-subtitle">
                                        <img src="../../assets/icons/grown_icon.png" class="subtitle-icon">
                                        <h3 class="subtitle">Lo que me lleve</h3>                                                        
                                    </div>
                                    <p id="learning-content" class="content-info"></p>
                                </div>     
                            </div>                        
                        </div>                                 
                    </div>
                    <div class="experience-pagination">
                        <button class="pagination-button" id="previous-experience">‹</button>
                        <div class="pagination-dots">
                            <button class="pagination-dot active"></button>
                            <button class="pagination-dot"></button>
                        </div>
                        <button class="pagination-button" id="next-experience">›</button>
                    </div>          
                </div>
            </div>
        </div>
        <script src="../../js/components/load-navbar.js"></script>
        <script type="module" src="../../js/pages/taller.js"></script>
    </body>
</html>
